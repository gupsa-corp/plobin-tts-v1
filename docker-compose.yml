services:
  tts-server:
    image: python:3.12
    container_name: tts-only-server
    working_dir: /app
    network_mode: host
    command: bash -c "cd /app && python -m venv venv && source venv/bin/activate && python -c 'import sys; print(sys.executable)' && ls -la && source korean_tts_env/bin/activate && export PYTHONPATH=/app/MeloTTS && python robust_tts_server.py"
    volumes:
      # 전체 프로젝트 디렉토리 마운트
      - .:/app
    environment:
      - PYTHONPATH=/app/MeloTTS
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:40003/api/models/status || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]